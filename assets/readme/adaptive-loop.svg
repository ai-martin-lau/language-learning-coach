    <rect x="770" y="425" width="190" height="130" rx="28" fill="#FFFDF8" stroke="#173B4A" stroke-width="3"/>
    <path d="M802 439h60" stroke="#2A9D8F" stroke-width="7" stroke-linecap="round"/>
    <path d="M802 471c0-9 7-16 16-16h54c9 0 16 7 16 16v22c0 9-7 16-16 16h-26l-16 13 3-13h-15c-9 0-16-7-16-16Z" fill="#F26B5B" stroke="#173B4A" stroke-width="3" stroke-linejoin="round"/>
    <path d="M852 487c0-9 7-16 16-16h54c9 0 16 7 16 16v22c0 9-7 16-16 16h-15l3 13-16-13h-26c-9 0-16-7-16-16Z" fill="#2A9D8F" stroke="#173B4A" stroke-width="3" stroke-linejoin="round"/>
