    <path d="M261 395c13 9 24 7 34-7" fill="none" stroke="#F26B5B" stroke-width="4" stroke-linecap="round" stroke-dasharray="4 7"/>
    <path d="m289 387 10-3-1 10" fill="none" stroke="#F26B5B" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
