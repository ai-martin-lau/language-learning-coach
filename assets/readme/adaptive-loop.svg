    <path d="M1042 324h60" stroke="#2A9D8F" stroke-width="7" stroke-linecap="round"/>
    <path d="M1050 402h110l-9 18h-92Z" fill="#E8D5B5" stroke="#173B4A" stroke-width="3" stroke-linejoin="round"/>
    <rect x="1081" y="348" width="50" height="60" rx="10" fill="#FFFDF8" stroke="#173B4A" stroke-width="3"/>
    <rect x="1091" y="361" width="30" height="11" rx="5.5" fill="none" stroke="#F26B5B" stroke-width="3" stroke-dasharray="5 4"/>
    <path d="M1106 394v-32" fill="none" stroke="#F26B5B" stroke-width="4" stroke-linecap="round"/>
    <path d="m1097 371 9-11 9 11" fill="none" stroke="#F26B5B" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1086 359c-12-13-22-14-30-10M1127 359c12-13 22-14 30-10" fill="none" stroke="#2A9D8F" stroke-width="3" stroke-linecap="round"/>
    <circle cx="1054" cy="347" r="10" fill="#F26B5B" stroke="#173B4A" stroke-width="3"/>
    <path d="m1157 336 12 21h-24Z" fill="#2A9D8F" stroke="#173B4A" stroke-width="3" stroke-linejoin="round"/>
