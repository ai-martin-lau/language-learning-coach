    <circle cx="911" cy="212.5" r="6" fill="#2A9D8F"/>
    <rect x="931" y="144" width="75" height="13" rx="6.5" fill="none" stroke="#173B4A" stroke-width="2" stroke-dasharray="5 4"/>
