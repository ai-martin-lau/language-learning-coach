<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="600"
     viewBox="0 0 1280 600"
     role="img"
     aria-labelledby="adaptive-loop-title adaptive-loop-desc">
  <title id="adaptive-loop-title">Adaptive language learning loop</title>
  <desc id="adaptive-loop-desc">Eight connected visual stages form a closed learning loop: a real task, reliable sound, understanding, a small set of adaptable chunks, retrieval and variation, short interaction and repair, focused feedback and another attempt, then delayed transfer to a new situation.</desc>

  <defs>
    <linearGradient id="background" x1="70" y1="20" x2="1210" y2="580" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="0.52" stop-color="#F8F4EC"/>
      <stop offset="1" stop-color="#F0E3CF"/>
    </linearGradient>
    <linearGradient id="coral-teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F26B5B"/>
      <stop offset="1" stop-color="#2A9D8F"/>
    </linearGradient>
    <filter id="card-shadow" x="-25%" y="-35%" width="150%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#173B4A" flood-opacity="0.15"/>
    </filter>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#173B4A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow-navy" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M1 1 11 6 1 11Z" fill="#173B4A"/>
    </marker>
  </defs>

  <rect width="1280" height="600" rx="30" fill="url(#background)"/>
  <path d="M0 470C105 424 182 445 253 508s148 87 250 70H0Z" fill="#2A9D8F" opacity="0.08"/>
  <path d="M1280 0v142c-87 19-158-1-218-57-39-36-88-58-148-66V0Z" fill="#F26B5B" opacity="0.08"/>
  <circle cx="110" cy="74" r="9" fill="#F26B5B" opacity="0.45"/>
  <circle cx="1184" cy="516" r="13" fill="#2A9D8F" opacity="0.42"/>
  <circle cx="1214" cy="482" r="5" fill="#173B4A" opacity="0.35"/>

  <path d="M165 170
           C290 62 450 74 640 108
           C830 74 990 92 1088 176
           C1188 262 1154 402 1020 470
           C900 548 735 524 620 492
           C482 532 314 508 220 418
           C124 326 112 232 165 170Z"
        fill="none"
        stroke="#DFCDB1"
        stroke-width="10"
        stroke-linecap="round"
        stroke-dasharray="2 20"
        opacity="0.75"/>

