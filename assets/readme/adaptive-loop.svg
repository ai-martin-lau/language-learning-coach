    <path d="m549 507 18 18" stroke="#173B4A" stroke-width="5" stroke-linecap="round"/>
    <path d="M610 470c18 0 31 13 31 29 0 17-14 30-31 30-11 0-21-6-27-15" fill="none" stroke="#2A9D8F" stroke-width="5" stroke-linecap="round"/>
    <path d="m580 526 1-16 15 5" fill="#2A9D8F" stroke="#173B4A" stroke-width="2" stroke-linejoin="round"/>
    <path d="m599 498 8 8 17-20" fill="none" stroke="#173B4A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Delayed transfer -->
  <g filter="url(#card-shadow)">
    <rect x="175" y="310" width="190" height="130" rx="28" fill="#FFFDF8" stroke="#173B4A" stroke-width="3"/>
    <path d="M207 324h60" stroke="#E8D5B5" stroke-width="7" stroke-linecap="round"/>
    <circle cx="228" cy="381" r="31" fill="#E8D5B5" stroke="#173B4A" stroke-width="3"/>
