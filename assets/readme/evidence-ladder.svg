<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" role="img" aria-labelledby="title desc">
  <title id="title">Separate language skill evidence progressing through increasingly demanding tasks</title>
  <desc id="desc">Six language skill icons feed into a four-stage rising route: supported practice, independent completion, changed-condition transfer, and delayed retention.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F1E5"/>
      <stop offset="1" stop-color="#EEF7F5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#13243A" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1l9 5-9 5z" fill="#1A786F"/>
    </marker>
  </defs>

  <rect width="1280" height="560" rx="34" fill="url(#background)"/>
  <path d="M46 468C214 442 269 500 414 446s184-191 325-193 180 107 269 57 130-163 230-187" fill="none" stroke="#E6B85C" stroke-width="5" stroke-linecap="round" stroke-dasharray="2 18" opacity="0.65"/>

  <!-- Six dimensions stay separate. -->
  <g filter="url(#shadow)">
    <rect x="54" y="58" width="414" height="444" rx="28" fill="#FFFFFF"/>
  </g>
  <path d="M261 206v148M187 280h148" stroke="#D8E4E2" stroke-width="2"/>

  <!-- Listening -->
  <g transform="translate(146 146)">
    <circle r="54" fill="#DDF2EE"/>
    <path d="M-12 13c0-31 36-32 36-6 0 17-17 17-17 31M-9-2c5-17 22-16 22-2 0 10-10 11-10 20" fill="none" stroke="#176D66" stroke-width="7" stroke-linecap="round"/>
    <path d="M-30-8c-9 8-9 19 0 27M-41-19c-17 15-17 36 0 51" fill="none" stroke="#176D66" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Spoken production -->
  <g transform="translate(374 146)">
    <circle r="54" fill="#FFE4D8"/>
    <rect x="-15" y="-31" width="30" height="48" rx="15" fill="none" stroke="#C94F35" stroke-width="7"/>
    <path d="M-30 4c0 27 60 27 60 0M0 31v17M-19 48h38" fill="none" stroke="#C94F35" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Reading -->
  <g transform="translate(146 280)">
    <circle r="54" fill="#E5E9F2"/>
    <path d="M0-28c-14-10-29-11-42-6v57c14-5 28-3 42 8 14-11 28-13 42-8v-57c-13-5-28-4-42 6z" fill="none" stroke="#233B5D" stroke-width="7" stroke-linejoin="round"/>
    <path d="M0-28v59" stroke="#233B5D" stroke-width="6"/>
  </g>

  <!-- Writing -->
  <g transform="translate(374 280)">
    <circle r="54" fill="#FFF1C9"/>
    <path d="M-30 32l10-29 40-40 18 18-40 40z" fill="none" stroke="#A46A08" stroke-width="7" stroke-linejoin="round"/>
    <path d="M20-37l18 18M-30 32l28-11" stroke="#A46A08" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Interaction -->
  <g transform="translate(146 414)">
    <circle r="54" fill="#DDF2EE"/>
    <path d="M-39-26h48a13 13 0 0 1 13 13v19A13 13 0 0 1 9 19h-22l-18 14 4-14h-12a13 13 0 0 1-13-13v-19a13 13 0 0 1 13-13z" transform="translate(7)" fill="none" stroke="#176D66" stroke-width="6" stroke-linejoin="round"/>
    <path d="M2-8h35a11 11 0 0 1 11 11v16a11 11 0 0 1-11 11H24l-14 11 3-11" fill="#DDF2EE" stroke="#176D66" stroke-width="6" stroke-linejoin="round"/>
  </g>

  <!-- Pronunciation -->
  <g transform="translate(374 414)">
    <circle r="54" fill="#FFE4D8"/>
    <path d="M-36 3c12-24 24-24 36 0s24 24 36 0M-36 23c12-16 24-16 36 0s24 16 36 0" fill="none" stroke="#C94F35" stroke-width="7" stroke-linecap="round"/>
    <path d="M-20-24c13-11 27-11 40 0" fill="none" stroke="#C94F35" stroke-width="7" stroke-linecap="round"/>
  </g>

  <path d="M492 280h84" fill="none" stroke="#1A786F" stroke-width="7" stroke-linecap="round" marker-end="url(#arrow)"/>

  <!-- Rising task evidence. -->
  <g filter="url(#shadow)">
    <path d="M598 404h128v-78h128v-78h128v-78h230v286H598z" fill="#FFFFFF"/>
  </g>
  <path d="M598 404h128v-78h128v-78h128v-78h230" fill="none" stroke="#233B5D" stroke-width="8" stroke-linejoin="round"/>

  <!-- Supported rehearsal -->
  <g transform="translate(661 364)">
    <circle r="42" fill="#FFF1C9" stroke="#E6B85C" stroke-width="5"/>
    <path d="M-19 5c7-18 15-22 22-11l8 12M-26 17c14 16 30 17 48 4M19-23v18M9-14h20" fill="none" stroke="#8A5A0B" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Independent task -->
  <g transform="translate(789 286)">
    <circle r="42" fill="#DDF2EE" stroke="#66B7AA" stroke-width="5"/>
    <circle cy="-13" r="11" fill="none" stroke="#176D66" stroke-width="6"/>
    <path d="M-23 26c2-24 44-24 46 0M-32 0l-10 9M32 0l10 9" fill="none" stroke="#176D66" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Changed condition transfer -->
  <g transform="translate(917 208)">
    <circle r="42" fill="#FFE4D8" stroke="#EE8C70" stroke-width="5"/>
    <path d="M-27-19h32c13 0 20 7 20 20v4M17-3l8 8 8-8M27 19H-5c-13 0-20-7-20-20v-4M-17 3l-8-8-8 8" fill="none" stroke="#C94F35" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Delayed retention -->
  <g transform="translate(1097 130)">
    <circle r="48" fill="#E5E9F2" stroke="#7A8DAA" stroke-width="5"/>
    <circle r="27" fill="none" stroke="#233B5D" stroke-width="6"/>
    <path d="M0-27v-10M-9-37h18M0 0V-17M0 0l15 9" fill="none" stroke="#233B5D" stroke-width="6" stroke-linecap="round"/>
    <path d="M-15 32l10 10 22-24" fill="none" stroke="#176D66" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <path d="M677 315c24-34 44-46 73-52M806 240c23-32 44-45 73-51M934 162c32-29 66-39 105-41" fill="none" stroke="#1A786F" stroke-width="5" stroke-linecap="round" marker-end="url(#arrow)"/>
</svg>
