      <path d="M69 166c0-23 9-38 23-38s23 15 23 38" fill="none" stroke-width="6"/>
      <path d="M61 195h62" fill="none" stroke="#2A9D8F" stroke-width="7"/>
      <path d="M73 220l19-14 19 14-19 14Z" fill="#E86F61" stroke-width="4"/>
