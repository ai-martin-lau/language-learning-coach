<svg xmlns="http://www.w3.org/2000/svg"
     width="1280"
     height="520"
     viewBox="0 0 1280 520"
     role="img"
     aria-labelledby="travel-scenarios-title travel-scenarios-desc"
     focusable="false">
  <title id="travel-scenarios-title">Six practical travel communication scenarios</title>
  <desc id="travel-scenarios-desc">A connected route passes six illustrated cards representing transport, lodging, dining, directions, shopping, and repairing a conversation.</desc>

  <defs>
    <filter id="card-shadow" x="-24" y="-20" width="232" height="410" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#17324D" flood-opacity="0.13"/>
    </filter>
    <pattern id="paper-grain" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="5" r="1.1" fill="#17324D" opacity="0.035"/>
      <circle cx="20" cy="17" r="0.8" fill="#17324D" opacity="0.03"/>
      <path d="M8 23h5" stroke="#17324D" stroke-width="1" opacity="0.025"/>
    </pattern>
  </defs>

  <rect width="1280" height="520" rx="32" fill="#F7F3EA"/>
  <rect width="1280" height="520" rx="32" fill="url(#paper-grain)"/>

  <!-- Abstract passport-stamp geometry in the surrounding margin. -->
  <g fill="none" stroke="#2A9D8F" opacity="0.22">
    <circle cx="104" cy="34" r="24" stroke-width="3"/>
    <circle cx="104" cy="34" r="17" stroke-width="1.5" stroke-dasharray="4 5"/>
    <path d="M82 24l44 20M83 45l42-22" stroke-width="1.5"/>
  </g>
  <g fill="none" stroke="#E86F61" opacity="0.2">
    <circle cx="1174" cy="36" r="27" stroke-width="3"/>
    <circle cx="1174" cy="36" r="19" stroke-width="1.5" stroke-dasharray="3 5"/>
    <path d="M1152 52l44-32M1151 21l46 31" stroke-width="1.5"/>
  </g>
  <path d="M188 34c95-20 180 18 274 0s184-14 278 2 188 12 278-4"
        fill="none" stroke="#17324D" stroke-width="2" stroke-linecap="round"
        stroke-dasharray="4 12" opacity="0.13"/>

