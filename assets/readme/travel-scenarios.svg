      <g fill="#E86F61" stroke="none">
        <circle cx="69" cy="155" r="7"/>
        <circle cx="91" cy="155" r="7"/>
        <circle cx="113" cy="155" r="7"/>
      </g>
      <path d="M49 237c8-11 22-17 36-15M135 254c-8 11-22 17-36 15"
            fill="none" stroke="#FFFDF8" stroke-width="6"/>
      <path d="m82 215 8 8-10 6M102 276l-8-8 10-6"
            fill="none" stroke="#FFFDF8" stroke-width="5"/>
    </g>
    <g fill="#E86F61">
      <circle cx="73" cy="316" r="5"/>
      <circle cx="92" cy="316" r="5"/>
      <circle cx="111" cy="316" r="5"/>
    </g>
  </g>

  <!-- A continuous route ties the six scenes together in reading order. -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 452c66 0 76-4 120-4 73 0 113 20 200 0s127-20 200 0 127 20 200 0 127-20 200 0 127 20 200 0c49-11 82-9 120-12"
