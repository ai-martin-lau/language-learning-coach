    <g stroke="#17324D" stroke-width="3" opacity="0.45">
      <path d="M140 414v34M340 414v34M540 414v34M740 414v34M940 414v34M1140 414v34"/>
    </g>
  </g>
  <g stroke="#F7F3EA" stroke-width="5">
    <circle cx="140" cy="448" r="11" fill="#2A9D8F"/>
    <circle cx="340" cy="448" r="11" fill="#E86F61"/>
    <circle cx="540" cy="448" r="11" fill="#17324D"/>
    <circle cx="740" cy="448" r="11" fill="#2A9D8F"/>
    <circle cx="940" cy="448" r="11" fill="#E86F61"/>
    <circle cx="1140" cy="448" r="11" fill="#17324D"/>
  </g>

  <!-- Geometric aircraft marker at the end of the route. -->
  <g transform="translate(1247 429) rotate(-14)" fill="#E86F61" stroke="#17324D" stroke-width="2.5" stroke-linejoin="round">
    <path d="M-26 8 24-10 8 12-3 16-8 30-16 33-14 14Z"/>
    <path d="M-3 16-18 3-11-1 8 12" fill="#F7F3EA"/>
  </g>
