      <path d="m10 7 3 6 5-5M-10-7l-3-6-5 5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <g stroke-linecap="round" stroke-linejoin="round">
      <path d="M29 133c0-15 12-27 27-27h68c15 0 27 12 27 27v44c0 15-12 27-27 27H83l-26 22 4-22h-5c-15 0-27-12-27-27Z"
