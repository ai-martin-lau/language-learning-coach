      <circle r="18" stroke-width="1.5" stroke-dasharray="3 5"/>
      <path d="M-13 6 0-12 13 6 0 13Z" stroke-width="2"/>
      <circle r="4" fill="#E86F61" stroke="none"/>
    </g>
    <g stroke="#17324D" stroke-linecap="round" stroke-linejoin="round">
