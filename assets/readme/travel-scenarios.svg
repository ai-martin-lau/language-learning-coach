      <rect x="46" y="108" width="92" height="124" rx="24" fill="#17324D"/>
      <rect x="57" y="124" width="70" height="46" rx="11" fill="#DCEFEA"/>
      <path d="M92 124v46" stroke="#2A9D8F" stroke-width="3"/>
      <path d="M56 186h72" stroke="#E86F61" stroke-width="8" stroke-linecap="round"/>
