  <g transform="translate(48 64)">
    <rect width="184" height="350" rx="26" fill="#FFFDF8" filter="url(#card-shadow)"/>
    <rect x="1" y="1" width="182" height="348" rx="25" fill="#FFFDF8" stroke="#2A9D8F" stroke-width="2"/>
    <path d="M1 292c49-28 101-18 182-64v96c0 14-11 25-25 25H26C12 349 1 338 1 324Z"
