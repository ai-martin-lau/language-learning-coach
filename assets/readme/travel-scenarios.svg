      <circle cx="73" cy="316" r="5"/>
      <circle cx="92" cy="316" r="5"/>
      <circle cx="111" cy="316" r="5"/>
    </g>
  </g>

  <!-- Card five: shopping. -->
  <g transform="translate(848 64)">
    <rect width="184" height="350" rx="26" fill="#F2E3C7" filter="url(#card-shadow)"/>
    <rect x="1" y="1" width="182" height="348" rx="25" fill="#F2E3C7" stroke="#E86F61" stroke-width="2"/>
    <circle cx="28" cy="294" r="80" fill="#F8DED8" opacity="0.62"/>
    <g transform="translate(145 42)" fill="none" stroke="#E86F61">
      <circle r="25" stroke-width="3"/>
      <circle r="18" stroke-width="1.5" stroke-dasharray="3 5"/>
      <path d="M-12-6h24M-8 2h16M-4 10h8" stroke-width="2"/>
