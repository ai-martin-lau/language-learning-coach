    <g transform="translate(145 42)" fill="none" stroke="#F7F3EA">
      <circle r="25" stroke-width="3"/>
      <circle r="18" stroke-width="1.5" stroke-dasharray="3 5"/>
      <path d="M-11 5c4 8 16 10 23 2M11-5c-4-8-16-10-23-2"
