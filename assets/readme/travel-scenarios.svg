    <path d="M117 193h10" stroke="#FFFDF8" stroke-width="3" stroke-linecap="round"/>
    <g fill="#E86F61">
      <circle cx="73" cy="316" r="5"/>
      <circle cx="92" cy="316" r="5"/>
      <circle cx="111" cy="316" r="5"/>
