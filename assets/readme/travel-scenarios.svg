  </g>

  <!-- Card six: communication repair. -->
  <g transform="translate(1048 64)">
    <rect width="184" height="350" rx="26" fill="#17324D" filter="url(#card-shadow)"/>
    <rect x="1" y="1" width="182" height="348" rx="25" fill="#17324D" stroke="#17324D" stroke-width="2"/>
    <path d="M1 281c56 26 118 18 182-37v80c0 14-11 25-25 25H26C12 349 1 338 1 324Z"
