    <g id="rollingBag" stroke-linecap="round" stroke-linejoin="round">
      <path d="M9 4V-13C9-23 24-23 24-13V4" fill="none" stroke="#17384A" stroke-width="5"/>
      <rect x="0" y="0" width="34" height="48" rx="8" fill="#EF6A50"/>
      <path d="M9 10V38M25 10V38" fill="none" stroke="#17384A" stroke-opacity="0.35" stroke-width="3"/>
      <circle cx="8" cy="52" r="4" fill="#17384A"/>
      <circle cx="26" cy="52" r="4" fill="#17384A"/>
    </g>

    <g id="plainKeyCard">
      <rect width="44" height="29" rx="7" fill="#FFF8EC" stroke="#17384A" stroke-width="3"/>
      <circle cx="11" cy="14.5" r="4" fill="#EF6A50"/>
      <path d="M22 10H35M22 18H31" fill="none" stroke="#2A8C88" stroke-width="3" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1280" height="460" fill="url(#canvasWash)"/>
  <path d="M0 47C148 1 274 2 408 36S687 85 826 39 1114-3 1280 42V0H0Z" fill="#2A8C88" opacity="0.08"/>
  <path d="M0 423C151 389 296 398 422 425S691 467 835 425 1118 388 1280 417V460H0Z" fill="#EF6A50" opacity="0.08"/>

  <!-- Complete spoken model -->
  <g filter="url(#softShadow)">
    <rect x="32" y="36" width="292" height="388" rx="28" fill="url(#panelOneWash)" stroke="#17384A" stroke-opacity="0.16" stroke-width="2"/>
  </g>
  <g>
    <circle cx="65" cy="71" r="10" fill="#EF6A50"/>
    <circle cx="292" cy="392" r="19" fill="none" stroke="#2A8C88" stroke-opacity="0.18" stroke-width="6"/>
    <circle cx="292" cy="392" r="7" fill="#2A8C88" opacity="0.28"/>

    <path d="M81 81H253C263 81 271 89 271 99V168C271 178 263 186 253 186H219L230 204 198 186H81C71 186 63 178 63 168V99C63 89 71 81 81 81Z" fill="#FFF8EC" stroke="#EF6A50" stroke-width="3"/>
    <path d="M88 135C96 135 96 107 105 107S114 161 123 161 132 96 141 96 150 165 159 165 168 111 177 111 186 153 195 153 204 117 213 117 222 143 231 143 240 127 248 127" fill="none" stroke="#2A8C88" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M111 203C103 195 102 184 106 175M98 210C85 196 83 178 90 163" fill="none" stroke="#EF6A50" stroke-width="4" stroke-linecap="round" opacity="0.8"/>

