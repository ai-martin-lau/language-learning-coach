<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460" role="img" aria-labelledby="lessonStoryboardTitle lessonStoryboardDesc">
  <title id="lessonStoryboardTitle">Travel lesson feedback storyboard</title>
  <desc id="lessonStoryboardDesc">Four wordless panels show a traveler hearing a complete spoken model, completing a hotel counter task, focusing on one correction, and immediately retrying after the condition changes.</desc>

  <defs>
    <linearGradient id="canvasWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8EC"/>
      <stop offset="1" stop-color="#E8B875" stop-opacity="0.28"/>
    </linearGradient>
    <linearGradient id="panelOneWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E8B875" stop-opacity="0.34"/>
      <stop offset="1" stop-color="#FFF8EC"/>
    </linearGradient>
    <linearGradient id="panelTwoWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2A8C88" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFF8EC"/>
    </linearGradient>
    <linearGradient id="panelThreeWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EF6A50" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#FFF8EC"/>
    </linearGradient>
    <linearGradient id="panelFourWash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17384A" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#FFF8EC"/>
    </linearGradient>
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#17384A" flood-opacity="0.12"/>
    </filter>
    <marker id="tealArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8Z" fill="#2A8C88"/>
    </marker>
    <marker id="coralArrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 8 4 0 8Z" fill="#EF6A50"/>
    </marker>

    <g id="travelerFacingRight" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-22-56C-39-52-43-26-39-2L-11-2-5-52Z" fill="#EF6A50"/>
      <path d="M-38-41-47-22M-39-12-49-8" fill="none" stroke="#17384A" stroke-width="4"/>
      <circle cx="0" cy="-73" r="17" fill="#E8B875"/>
      <path d="M-17-76C-14-96 13-98 19-79 11-83 6-88-3-84-8-81-11-77-17-76Z" fill="#17384A"/>
      <path d="M16-74 23-70 16-66Z" fill="#E8B875"/>
      <circle cx="8" cy="-75" r="2.2" fill="#17384A"/>
      <path d="M-17-52C-8-59 9-58 17-49L21-7H-22Z" fill="#2A8C88"/>
      <path d="M13-45C25-39 28-26 41-24" fill="none" stroke="#E8B875" stroke-width="9"/>
      <circle cx="43" cy="-24" r="5" fill="#E8B875"/>
      <path d="M-17-7-20 35M12-7 17 35" fill="none" stroke="#17384A" stroke-width="13"/>
      <path d="M-28 36H-11M10 36H28" fill="none" stroke="#17384A" stroke-width="8"/>
    </g>

    <g id="clerkFacingLeft" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-68" r="17" fill="#E8B875"/>
      <path d="M-19-75C-12-94 13-93 20-74 12-80 4-82-5-79-10-77-15-75-19-75Z" fill="#17384A"/>
      <path d="M-17-52C-7-60 9-59 19-50L23 0H-23Z" fill="#17384A"/>
      <path d="M-9-52 0-40 9-52" fill="#FFF8EC"/>
      <path d="M-14-42C-25-34-29-23-42-20" fill="none" stroke="#E8B875" stroke-width="9"/>
      <circle cx="-44" cy="-20" r="5" fill="#E8B875"/>
      <circle cx="-7" cy="-70" r="2.2" fill="#17384A"/>
    </g>

    <g id="serviceCounter">
      <rect x="0" y="0" width="126" height="16" rx="8" fill="#17384A"/>
      <path d="M8 14H118V94C118 101 112 107 105 107H21C14 107 8 101 8 94Z" fill="#E8B875"/>
      <path d="M38 22V99M78 22V99" fill="none" stroke="#17384A" stroke-opacity="0.14" stroke-width="3"/>
