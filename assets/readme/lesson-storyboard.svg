    <use href="#clerkFacingLeft" transform="translate(245 282) scale(.84)"/>
    <use href="#serviceCounter" transform="translate(181 279) scale(.92)"/>
    <path d="M249 280C249 264 264 264 264 280" fill="#EF6A50"/>
    <circle cx="256.5" cy="273" r="7" fill="#EF6A50"/>
  </g>

  <!-- Traveler completes the micro-task -->
  <g filter="url(#softShadow)">
    <rect x="340" y="36" width="292" height="388" rx="28" fill="url(#panelTwoWash)" stroke="#17384A" stroke-opacity="0.16" stroke-width="2"/>
  </g>
  <g>
    <circle cx="373" cy="71" r="10" fill="#2A8C88"/>
    <path d="M382 88H529C539 88 547 96 547 106V161C547 171 539 179 529 179H421L396 196 401 179H382C372 179 364 171 364 161V106C364 96 372 88 382 88Z" fill="#FFF8EC" stroke="#2A8C88" stroke-width="3"/>
    <path d="M387 137C396 137 397 112 406 112S416 157 425 157 434 104 443 104 452 161 461 161 470 116 479 116 488 151 497 151 506 123 515 123 524 141 533 141" fill="none" stroke="#EF6A50" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="591" cy="94" r="21" fill="#2A8C88"/>
    <path d="M580 94 588 102 602 84" fill="none" stroke="#FFF8EC" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>

    <use href="#travelerFacingRight" transform="translate(414 352) scale(.9)"/>
    <use href="#rollingBag" transform="translate(359 330) scale(.72)"/>
    <use href="#clerkFacingLeft" transform="translate(553 282) scale(.84)"/>
    <use href="#serviceCounter" transform="translate(489 279) scale(.92)"/>
    <use href="#plainKeyCard" transform="translate(482 246) rotate(-6) scale(.84)"/>
    <path d="M469 257 487 253" fill="none" stroke="#E8B875" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- One focused correction -->
  <g filter="url(#softShadow)">
    <rect x="648" y="36" width="292" height="388" rx="28" fill="url(#panelThreeWash)" stroke="#17384A" stroke-opacity="0.16" stroke-width="2"/>
  </g>
  <g>
    <circle cx="681" cy="71" r="10" fill="#EF6A50"/>
    <rect x="678" y="89" width="232" height="105" rx="24" fill="#FFF8EC" stroke="#17384A" stroke-opacity="0.3" stroke-width="3"/>
    <path d="M698 142C707 142 708 118 717 118S726 163 735 163 744 108 753 108 762 166 771 166 780 122 789 122" fill="none" stroke="#2A8C88" stroke-width="7" stroke-linecap="round"/>
    <path d="M789 122C798 122 807 157 816 157 825 157 834 128 843 128" fill="none" stroke="#EF6A50" stroke-width="7" stroke-linecap="round"/>
    <path d="M843 128C852 128 861 149 870 149 879 149 887 137 895 137" fill="none" stroke="#2A8C88" stroke-width="7" stroke-linecap="round"/>
    <circle cx="816" cy="140" r="30" fill="none" stroke="#EF6A50" stroke-width="4"/>
    <path d="M816 101V110M816 170V179M777 140H786M846 140H855" fill="none" stroke="#EF6A50" stroke-width="4" stroke-linecap="round"/>
    <path d="M867 210C852 196 839 188 827 177" fill="none" stroke="#E8B875" stroke-width="10" stroke-linecap="round"/>
    <circle cx="825" cy="176" r="6" fill="#E8B875"/>

    <use href="#travelerFacingRight" transform="translate(719 352) scale(.86)"/>
    <use href="#clerkFacingLeft" transform="translate(864 282) scale(.84)"/>
    <use href="#serviceCounter" transform="translate(797 279) scale(.92)"/>
    <path d="M862 279 846 228" fill="none" stroke="#E8B875" stroke-width="9" stroke-linecap="round"/>
  </g>

  <!-- Changed condition and immediate retry -->
  <g filter="url(#softShadow)">
    <rect x="956" y="36" width="292" height="388" rx="28" fill="url(#panelFourWash)" stroke="#17384A" stroke-opacity="0.16" stroke-width="2"/>
  </g>
  <g>
    <circle cx="989" cy="71" r="10" fill="#17384A"/>

    <rect x="989" y="94" width="52" height="35" rx="8" fill="#E8B875" stroke="#17384A" stroke-width="3"/>
    <circle cx="1003" cy="111.5" r="5" fill="#EF6A50"/>
    <path d="M1015 106H1030M1015 117H1025" fill="none" stroke="#2A8C88" stroke-width="3" stroke-linecap="round"/>
    <rect x="1162" y="94" width="52" height="35" rx="8" fill="#2A8C88" stroke="#17384A" stroke-width="3"/>
    <circle cx="1176" cy="111.5" r="5" fill="#FFF8EC"/>
    <path d="M1188 106H1203M1188 117H1198" fill="none" stroke="#FFF8EC" stroke-width="3" stroke-linecap="round"/>
    <path d="M1049 99C1076 76 1125 76 1153 98" fill="none" stroke="#2A8C88" stroke-width="5" stroke-linecap="round" marker-end="url(#tealArrow)"/>
    <path d="M1153 126C1125 149 1076 149 1048 127" fill="none" stroke="#EF6A50" stroke-width="5" stroke-linecap="round" marker-end="url(#coralArrow)"/>

    <path d="M1001 166H1178C1188 166 1196 174 1196 184V231C1196 241 1188 249 1178 249H1051L1026 267 1031 249H1001C991 249 983 241 983 231V184C983 174 991 166 1001 166Z" fill="#FFF8EC" stroke="#2A8C88" stroke-width="3"/>
    <path d="M1008 211C1017 211 1018 188 1027 188S1036 232 1045 232 1054 180 1063 180 1072 235 1081 235 1090 193 1099 193 1108 226 1117 226 1126 199 1135 199 1144 218 1153 218 1162 204 1171 204" fill="none" stroke="#2A8C88" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M1204 195C1220 210 1221 236 1206 253" fill="none" stroke="#EF6A50" stroke-width="5" stroke-linecap="round" marker-end="url(#coralArrow)"/>

    <use href="#travelerFacingRight" transform="translate(1027 352) scale(.9)"/>
    <use href="#rollingBag" transform="translate(972 330) scale(.72)"/>
    <use href="#clerkFacingLeft" transform="translate(1171 282) scale(.84)"/>
    <use href="#serviceCounter" transform="translate(1105 279) scale(.92)"/>
    <use href="#plainKeyCard" transform="translate(1098 246) rotate(5) scale(.84)"/>
  </g>

  <path d="M324 230H340M632 230H648M940 230H956" fill="none" stroke="#17384A" stroke-opacity="0.18" stroke-width="4" stroke-linecap="round"/>
</svg>
